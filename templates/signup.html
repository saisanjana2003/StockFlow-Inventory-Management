<!DOCTYPE html>
<html>
<head>
    <title>StockFlow | Sign Up</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow p-4">
                <h2 class="text-center">Create Account</h2>
                <p class="text-center text-muted">Start managing your inventory</p>

                {% with messages = get_flashed_messages() %}
                    {% for message in messages %}
                        <div class="alert alert-info">{{ message }}</div>
                    {% endfor %}
                {% endwith %}

                <form method="POST">
                    <label>Organization Name</label>
                    <input type="text" name="organization" class="form-control mb-3" required>

                    <label>Email</label>
                    <input type="email" name="email" class="form-control mb-3" required>

                    <label>Password</label>
                    <input type="password" name="password" class="form-control mb-3" minlength="8" required>

                    <button class="btn btn-primary w-100">Create Account</button>
                </form>

                <p class="text-center mt-3">
                    Already registered?
                    <a href="{{ url_for('login') }}">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
