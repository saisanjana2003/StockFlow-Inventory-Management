<!DOCTYPE html>
<html>
<head>
    <title>StockFlow | Product Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">StockFlow</a>
</nav>

<div class="container mt-4">
    <div class="card shadow-sm p-4 mx-auto" style="max-width:650px">

        <h3 class="mb-4">
            {{ 'Edit Product' if product else 'Add New Product' }}
        </h3>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <div class="alert alert-danger">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">

            <label class="form-label">Product Name *</label>
            <input type="text" name="name" class="form-control mb-3"
                   value="{{ product.name if product else '' }}" required>

            <label class="form-label">SKU *</label>
            <input type="text" name="sku" class="form-control mb-3"
                   value="{{ product.sku if product else '' }}" required>

            <label class="form-label">Description</label>
            <textarea name="description" class="form-control mb-3">{{ product.description if product else '' }}</textarea>

            <label class="form-label">Quantity on Hand *</label>
            <input type="number" name="quantity" min="0"
                   class="form-control mb-3"
                   value="{{ product.quantity if product else 0 }}" required>

            <label class="form-label">Cost Price</label>
            <input type="number" name="cost_price" min="0" step="0.01"
                   class="form-control mb-3"
                   value="{{ product.cost_price if product and product.cost_price is not none else '' }}">

            <label class="form-label">Selling Price</label>
            <input type="number" name="selling_price" min="0" step="0.01"
                   class="form-control mb-3"
                   value="{{ product.selling_price if product and product.selling_price is not none else '' }}">

            <label class="form-label">Low Stock Threshold</label>
            <input type="number" name="low_stock_threshold" min="0"
                   class="form-control mb-3"
                   value="{{ product.low_stock_threshold if product and product.low_stock_threshold is not none else '' }}"
                   placeholder="Leave blank to use organization default">

            <button type="submit" class="btn btn-primary w-100">
                {{ 'Update Product' if product else 'Save Product' }}
            </button>

        </form>

        <a href="{{ url_for('products') }}" class="btn btn-secondary mt-3">
            Cancel
        </a>

    </div>
</div>

</body>
</html>
